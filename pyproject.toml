[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skilllifebench"
version = "1.0.0"
description = "Lifecycle security evaluation and frozen evidence replay for agent skills"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18,<5"]

[project.urls]
Repository = "https://github.com/Tasselszcx/SkillLifeBench"

[project.scripts]
skilllifebench = "skilllifebench.__main__:main"

[tool.setuptools]
packages = ["skilllifebench", "www2027", "www2027.lifecycle_autonomy_v60"]
