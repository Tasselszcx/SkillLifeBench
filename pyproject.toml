[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skilllifebench"
version = "1.0.2"
description = "Lifecycle security evaluation and frozen evidence replay for agent skills"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name = "Chenxu Zhang"},
  {name = "Zhou Liu"},
  {name = "Wu Xin"},
  {name = "Wentao Zhang"},
]
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18,<5"]

[project.urls]
Repository = "https://github.com/Tasselszcx/SkillLifeBench"

[project.scripts]
skilllifebench = "skilllifebench.__main__:main"

[tool.setuptools.packages.find]
include = ["skilllifebench*"]
